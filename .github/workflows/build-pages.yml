# Managed by Voyage Sans Détour cloud package v1.
name: Build and deploy Voyage Sans Détour

on:
  push:
    branches: [main]
    paths:
      - 'site-src/**'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site-src
    steps:
      - name: Checkout reviewed public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate site
        run: python -m unittest -q test_site
      - name: Build public artifact
        env:
          LJA_PUBLIC: '1'
          SITE_ORIGIN: https://voyagesansdetour.fr
        run: python generate.py
      - name: Upload website only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-src/public
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /social-media/lancement-2026-09/credits.txt; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 "https://voyagesansdetour.fr$path" --output /dev/null
          done
