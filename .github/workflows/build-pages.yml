# Managed by Voyage Sans Détour cloud package v1.
name: Build and deploy Voyage Sans Détour

on:
  push:
    branches: [main]
    paths:
      - 'site-src/**'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * *'

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'MathCSN/voyagesansdetour' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      source_sha: ${{ steps.persist.outputs.source_sha }}
      release_manifest: ${{ steps.manifest.outputs.manifest }}
    defaults:
      run:
        working-directory: site-src
    steps:
      - name: Checkout reviewed public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed only for the atomic catalogue+queue commit below, on main.
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Release one reviewed article when due
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from pathlib import Path
          import editorial_queue as q
          now = dt.datetime.now(dt.timezone.utc)
          scheduled = os.environ['EVENT_NAME'] == 'schedule'
          active = now <= q.instant('2027-09-14T23:59:59+02:00')
          changed = q.promote(now=now) if active else False
          _, queue = q.load(now=now)
          pending = any(p['receipt'] is None for p in queue['promotions'])
          publish = not scheduled or (active and (changed or pending))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:
              f.write('publish=' + str(publish).lower() + '\n')
          PY
      - name: Validate site
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest -q test_site test_stay22 test_editorial_queue
      - name: Validate analytics consent without external calls
        if: steps.release.outputs.publish == 'true'
        run: node --test test_analytics.mjs
      - name: Build public artifact
        if: steps.release.outputs.publish == 'true'
        env:
          LJA_PUBLIC: '1'
          SITE_ORIGIN: https://voyagesansdetour.fr
        run: python generate.py
      - name: Bind release proof to the exact source and HTML
        if: steps.release.outputs.publish == 'true'
        id: manifest
        run: python editorial_queue.py manifest --github-output "$GITHUB_OUTPUT"
      - name: Persist promotion before deployment
        if: steps.release.outputs.publish == 'true'
        id: persist
        run: |
          set -euo pipefail
          git add -- articles.json editorial-queue.json
          if ! git diff --cached --quiet; then
            git -c user.name='Voyage Sans Détour' -c user.email='contact@voyagesansdetour.fr' commit -m 'Promote a reviewed editorial release'
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload website only
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-src/public
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Recheck release validity before deployment
        env:
          RELEASE_MANIFEST: ${{ needs.build.outputs.release_manifest }}
        working-directory: site-src
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          python editorial_queue.py check-window --manifest-json "$RELEASE_MANIFEST"
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /social-media/lancement-2026-09/credits.txt; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 "https://voyagesansdetour.fr$path" --output /dev/null
          done
      - name: Confirm new pages by their exact HTML hashes
        env:
          RELEASE_MANIFEST: ${{ needs.build.outputs.release_manifest }}
        working-directory: site-src
        run: |
          set -euo pipefail
          python editorial_queue.py confirm --manifest-json "$RELEASE_MANIFEST"
          git add -- editorial-queue.json
          if ! git diff --cached --quiet; then
            git -c user.name='Voyage Sans Détour' -c user.email='contact@voyagesansdetour.fr' commit -m 'Record verified editorial release receipts'
            git push origin HEAD:main
          fi
