name: Qualify a source-grounded new VSD guide
on:
  # Asleep since 2026-11-12: in 51 scheduled runs since 2026-10-12 this writer never got a guide past its own
  # review (guide_held_by_review, guide_photos_insufficient), while spending up to 3 000 neurons a run.
  # New guides come from the cloud routines (Monday and Thursday). To wake it up once its review passes on a
  # manual run, put back: schedule: [{cron: "23 6 * * *"}, {cron: "23 15 * * *"}].
  workflow_dispatch:
    inputs:
      writer:
        description: Bounded comparison of the full-guide writer
        type: choice
        options: [llama, qwen]
        default: llama
# Dispatched on another branch, the run is a dry run: it writes, reviews and admits a guide in
# the runner's own checkout and keeps the proof as an artifact, but pushes nothing and spends
# about 3 500 of the 10 000 free daily neurons.
permissions: {}
concurrency:
  group: vsd-workers-ai-writing
  cancel-in-progress: false
jobs:
  draft:
    if: github.repository == 'MathCSN/voyagesansdetour' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate editorial grounding without inference
        run: python3 -m unittest discover -s .github/vsd-writing -p 'test_*.py'
      - name: Install the photo recompressor
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Find photos, research and draft one new guide
        env:
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          REPORT_DIR: ${{ runner.temp }}/vsd-new-guide
          GUIDE_WRITER_MODEL: ${{ inputs.writer || 'llama' }}
        run: python3 .github/vsd-writing/guide_draft.py
      - name: Admit one qualified new guide when the calendar allows it
        id: admission
        env:
          REPORT_DIR: ${{ runner.temp }}/vsd-new-guide
        run: python3 .github/vsd-writing/admit_guide.py
      - name: Validate queued guide and persist its evidence
        if: steps.admission.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s site-src -p 'test_editorial_queue.py'
          python3 -m unittest discover -s site-src -p 'test_site.py'
          git add -- site-src/editorial-queue.json site-src/editorial-guide-evidence site-src/image-sources.json site-src/dist/assets/photos
          git -c user.name='Voyage Sans Détour' -c user.email='contact@voyagesansdetour.fr' commit -m 'Admit a source-verified new guide with its photos and review evidence'
          git push origin HEAD:main
          gh workflow run build-pages.yml --ref main
      - name: Dry run outside main - validate the queued guide and keep the proof only
        if: steps.admission.outputs.changed == 'true' && github.ref != 'refs/heads/main'
        env:
          REPORT_DIR: ${{ runner.temp }}/vsd-new-guide
        run: |
          set -euo pipefail
          python3 -m unittest discover -s site-src -p 'test_editorial_queue.py'
          python3 -m unittest discover -s site-src -p 'test_site.py'
          cp site-src/editorial-queue.json "$REPORT_DIR/dry-run-editorial-queue.json"
          git status --short -- site-src > "$REPORT_DIR/dry-run-changes.txt"
          cat "$REPORT_DIR/dry-run-changes.txt"
      - name: Preserve qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: new-guide-proposal
          path: |
            ${{ runner.temp }}/vsd-new-guide/*.json
            ${{ runner.temp }}/vsd-new-guide/*.txt
            ${{ runner.temp }}/vsd-new-guide/photos/
          retention-days: 7
          if-no-files-found: error
