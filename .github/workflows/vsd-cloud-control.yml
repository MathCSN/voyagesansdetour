# Appels signés du panneau privé vsd-admin : publications toutes les 30 min, import du stock relu chaque jour à 08:53 UTC.
# Les statistiques sont relevées par le panneau lui-même (tâche planifiée Cloudflare). Aucun appel payant.
name: Voyage Sans Detour cloud control
on:
  schedule:
    - cron: '13,43 * * * *'
    - cron: '53 8 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Tâche du panneau privé'
        required: true
        default: health
        type: choice
        options: [health, publications, stock, metrics]
permissions: {}
concurrency:
  group: vsd-cloud-control
  cancel-in-progress: false
jobs:
  invoke:
    if: github.repository == 'MathCSN/voyagesansdetour' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read the versioned panel client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Invoke signed private panel task
        env:
          VSD_ADMIN_ORIGIN: https://vsd-admin.kartier.workers.dev
          VSD_ADMIN_TICK_KEY: ${{ secrets.VSD_ADMIN_TICK_KEY }}
          # Route by the triggering cron, including when GitHub delays execution.
          VSD_TICK_KIND: ${{ inputs.kind || (github.event.schedule == '53 8 * * *' && 'stock' || 'publications') }}
        run: |
          node --test .github/vsd-control/invoke-admin.test.mjs
          node .github/vsd-control/invoke-admin.mjs
