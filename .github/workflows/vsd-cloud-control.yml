# Signed cloud control: reviewed social stock and read-only metrics. No content generation or paid calls.
name: Voyage Sans Detour cloud control
on:
  schedule:
    - cron: '13,43 * * * *'
    - cron: '23 6,7,8 * * *'
    - cron: '53 8 * * 1'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Server task (metrics/publications require private activation)'
        required: true
        default: health
        type: choice
        options: [health, metrics, publications, stock, stock_status]
permissions: {}
concurrency:
  group: vsd-cloud-control
  cancel-in-progress: false
jobs:
  invoke:
    if: github.repository == 'MathCSN/voyagesansdetour' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Read the immutable reviewed stock index
        if: inputs.kind == 'stock' || inputs.kind == 'stock_status' || github.event.schedule == '53 8 * * 1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile reviewed stock receipts before any import
        if: inputs.kind == 'stock' || inputs.kind == 'stock_status' || github.event.schedule == '53 8 * * 1'
        env:
          VSD_CLOUD_KEY: ${{ secrets.VSD_CLOUD_KEY }}
          VSD_SITES_DISPATCH_TOKEN: ${{ secrets.VSD_SITES_DISPATCH_TOKEN }}
          VSD_STOCK_READ_ONLY: ${{ inputs.kind == 'stock_status' && 'true' || 'false' }}
        run: node .github/vsd-production/stock-control.mjs
      - name: Invoke signed private server task (three bounded metrics passes)
        if: inputs.kind != 'stock' && inputs.kind != 'stock_status' && github.event.schedule != '53 8 * * 1'
        env:
          VSD_CLOUD_ORIGIN: https://voyage-sans-detour-admin.cousinmathis31.chatgpt.site
          VSD_SITE_ID: appgprj_6ab8ae0785988191a26f73b4a4e6c687
          VSD_CLOUD_KEY: ${{ secrets.VSD_CLOUD_KEY }}
          VSD_SITES_DISPATCH_TOKEN: ${{ secrets.VSD_SITES_DISPATCH_TOKEN }}
          # Route by the triggering cron, including when GitHub delays execution.
          VSD_TICK_KIND: ${{ inputs.kind || (github.event.schedule == '23 6,7,8 * * *' && 'metrics' || 'publications') }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // Intended for the standard GitHub-hosted runner. Never print credentials or raw responses.
          import { createHash, createHmac, randomUUID } from 'node:crypto';
          
          try {
            if (Date.now() > Date.parse('2027-09-14T23:59:59+02:00')) {
              console.log('Follow-up period ended; no request sent.');
              process.exit(0);
            }
            const origin = process.env.VSD_CLOUD_ORIGIN;
            const id = process.env.VSD_SITE_ID;
            const key = process.env.VSD_CLOUD_KEY;
            const dispatcher = process.env.VSD_SITES_DISPATCH_TOKEN;
            const kind = process.env.VSD_TICK_KIND || 'health';
            if (origin !== 'https://voyage-sans-detour-admin.cousinmathis31.chatgpt.site' ||
                id !== 'appgprj_6ab8ae0785988191a26f73b4a4e6c687' || !/^[A-Za-z0-9_-]{43}$/.test(key ?? '') ||
                !dispatcher || !['health','metrics','publications'].includes(kind)) throw Error('configuration');
            const wireKind=kind,payload={kind};
            const path = '/internal/tick', body = JSON.stringify(payload);
            if(Buffer.byteLength(body)>133120)throw Error('invalid_batch');
            const digest = createHash('sha256').update(body).digest('hex');
            const keyBytes = Buffer.from(key,'base64url');
            const passes = kind === 'metrics' ? 3 : 1;
            let lastSentAt = 0;
            for(let pass = 0; pass < passes; pass++) {
              // Never start a pass after the authorized follow-up period.
              if(Date.now() > Date.parse('2027-09-14T23:59:59+02:00'))break;
              // The server requires an increasing timestamp per task kind, even within one millisecond.
              const sentAt = Math.max(Date.now(),lastSentAt+1);
              lastSentAt = sentAt;
              const sent = String(sentAt), nonce = randomUUID();
              const canonical = ['vsd-cloud-v1',id,origin,'POST',path,sent,nonce,digest].join('\n');
              const signature = createHmac('sha256',keyBytes).update(canonical).digest('hex');
              // One attempt per pass. An uncertain outcome stops the job; never replay that request.
              const response = await fetch(origin + path, {method:'POST',redirect:'error',signal:AbortSignal.timeout(60000),
                headers:{'Content-Type':'application/json','OAI-Sites-Authorization':'Bearer '+dispatcher,
                  'X-VSD-Sent-At':sent,'X-VSD-Nonce':nonce,'X-VSD-Signature':signature},body});
              if(response.status!==200 || !response.headers.get('content-type')?.includes('application/json'))throw Error('unavailable');
              const text=await response.text();if(text.length>1024)throw Error('invalid_response');
              const data=JSON.parse(text);
              // A finished metrics tick confirms execution, not the presence or success of every provider report.
              const allowed={health:['healthy'],metrics:['disabled','finished'],
                publications:['disabled','idle','busy_or_recent','dispatched','reconciled','recovered']}[kind];
              if(!allowed || data.kind!==wireKind || !allowed.includes(data.status))throw Error('task_attention_required');
              console.log('Cloud receipt: '+kind+' / '+data.status+'.');
              if(kind==='metrics' && data.status==='disabled')break;
            }
          } catch {
            console.error('Cloud task not confirmed. Check the private service; no automatic retry was made.');
            process.exitCode=1;
          }
          NODE
