name: Revise a held VSD guide once
on:
  workflow_dispatch:
    inputs:
      revision_run:
        description: Optional successful held revision to continue (maximum three generations)
        type: string
        default: ""
      proposal_run:
        description: Existing successful guide pilot to review without regenerating it
        type: string
        default: "38203259983"
      review_run:
        description: Successful bound review containing the held guide issues
        type: string
        default: "38204109305"
permissions: {}
concurrency:
  group: vsd-workers-ai-writing
  cancel-in-progress: false
jobs:
  draft:
    if: github.repository == 'MathCSN/voyagesansdetour' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Validate grounding checks without inference
        run: python3 -m unittest discover -s .github/vsd-writing -p 'test_*.py'
      - name: Read the existing guide artifact from the expected workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_RUN: ${{ inputs.proposal_run }}
          REVIEW_RUN: ${{ inputs.review_run }}
          REVISION_RUN: ${{ inputs.revision_run }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          repo='MathCSN/voyagesansdetour'
          artifacts=[
              ('PROPOSAL_RUN','vsd-writing-guide.yml','new-guide-proposal','prior-guide'),
              ('REVIEW_RUN','vsd-writing-guide-review.yml','guide-review-evaluation','prior-review')]
          if os.environ.get('REVISION_RUN'):
              artifacts.append(('REVISION_RUN','vsd-writing-guide-revision.yml','guide-revision','prior-revision'))
          for variable,workflow_name,artifact,folder in artifacts:
              run=os.environ[variable]
              assert re.fullmatch(r'[0-9]{1,20}',run)
              metadata=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
              workflow=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/{workflow_name}']))
              assert metadata['workflow_id']==workflow['id'] and metadata['conclusion']=='success' and metadata['head_branch']=='main' and metadata['run_attempt']==1
              subprocess.run(['gh','run','download',run,'--name',artifact,'--dir',os.environ['RUNNER_TEMP']+'/'+folder],check=True)
          PY
      - name: Revise held blocks and recheck the full text
        env:
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          REPORT_DIR: ${{ runner.temp }}/vsd-source-draft
          PROPOSAL_DIR: ${{ runner.temp }}/prior-guide
          REVIEW_DIR: ${{ runner.temp }}/prior-review
          REVISION_DIR: ${{ inputs.revision_run != '' && format('{0}/prior-revision', runner.temp) || '' }}
          PARENT_REVISION_RUN: ${{ inputs.revision_run }}
        run: python3 .github/vsd-writing/guide_revision.py
      - name: Admit one qualified new guide when the calendar allows it
        id: admission
        env:
          REPORT_DIR: ${{ runner.temp }}/vsd-source-draft
        run: python3 .github/vsd-writing/admit_guide.py
      - name: Validate queued guide and persist its evidence
        if: steps.admission.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s site-src -p 'test_editorial_queue.py'
          git add -- site-src/editorial-queue.json site-src/editorial-guide-evidence
          git -c user.name='Voyage Sans Détour' -c user.email='contact@voyagesansdetour.fr' commit -m 'Admit a source-verified new guide with review evidence'
          git push origin HEAD:main
          gh workflow run build-pages.yml --ref main
      - name: Preserve pilot evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guide-revision
          path: ${{ runner.temp }}/vsd-source-draft/*.json
          retention-days: 7
          if-no-files-found: error
