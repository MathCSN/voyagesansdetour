name: Qualify two free VSD French voices
on:
  workflow_dispatch:
    inputs:
      content:
        description: Render fixed samples or the source-bound bagage storyboard
        type: choice
        options: [samples, bagages]
        default: samples
permissions: {}
concurrency:
  group: vsd-voice-pilot
  cancel-in-progress: false
jobs:
  samples:
    if: github.repository == 'MathCSN/voyagesansdetour' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Respect the authorised period before dependencies
        id: period
        run: |
          python3 - <<'PY'
          import datetime as dt,os
          active=dt.datetime.now(dt.timezone.utc)<dt.datetime(2027,9,14,21,59,59,tzinfo=dt.timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('active='+str(active).lower()+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.period.outputs.active == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.period.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install the free CPU synthesizer and video renderer
        if: steps.period.outputs.active == 'true'
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0 Pillow==11.3.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - name: Test voice, timing and source integrity
        if: steps.period.outputs.active == 'true'
        working-directory: .github/vsd-production/voice
        run: |
          python -m unittest -q test_pilot test_compose test_storyboard
      - name: Render the fixed voice samples
        if: steps.period.outputs.active == 'true' && inputs.content == 'samples'
        working-directory: .github/vsd-production/voice
        run: |
          python pilot.py --output "$RUNNER_TEMP/vsd-french-voices"
          python compose.py --audio "$RUNNER_TEMP/vsd-french-voices" --output "$RUNNER_TEMP/vsd-voice-videos"
      - name: Render the source-bound bagage storyboard
        if: steps.period.outputs.active == 'true' && inputs.content == 'bagages'
        working-directory: .github/vsd-production/voice
        run: python storyboard.py --storyboard ../reel-drafts/reel-article-portugal-sans-voiture-bagages --output "$RUNNER_TEMP/vsd-storyboard-media"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.period.outputs.active == 'true' && inputs.content == 'samples'
        with:
          name: vsd-french-voice-samples
          path: ${{ runner.temp }}/vsd-french-voices
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.period.outputs.active == 'true' && inputs.content == 'samples'
        with:
          name: vsd-voice-video-pilots
          path: ${{ runner.temp }}/vsd-voice-videos
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.period.outputs.active == 'true' && inputs.content == 'bagages'
        with:
          name: vsd-storyboard-media
          path: ${{ runner.temp }}/vsd-storyboard-media
          if-no-files-found: error
          retention-days: 30
