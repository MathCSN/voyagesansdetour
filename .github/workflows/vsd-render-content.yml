# Render already-reviewed scenarios only. No provider API, paid generator or social send.
name: Voyage Sans Detour reviewed media production

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions: {}
concurrency:
  group: vsd-reviewed-media-production
  cancel-in-progress: false

jobs:
  render:
    # Public standard GitHub runners only. A private repo is never a paid fallback.
    # The weekly schedule stays off until a qualified manual run is inspected.
    if: github.repository == 'MathCSN/voyagesansdetour' && github.ref == 'refs/heads/main' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.VSD_FREE_RENDER_SCHEDULE == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: .github/vsd-production
    steps:
      - name: Stop before fetching dependencies after the authorised period
        id: period
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import datetime as dt, os
          end = dt.datetime(2027, 9, 14, 21, 59, 59, tzinfo=dt.timezone.utc)
          active = dt.datetime.now(dt.timezone.utc) <= end
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          PY
      - name: Checkout the reviewed catalogue and existing render receipts
        if: steps.period.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Python 3.12
        if: steps.period.outputs.active == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare the free standard runner prerequisites
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate production guards
        if: steps.period.outputs.active == 'true'
        run: python -m unittest -q test_production test_pin_intake test_pin_promotion test_reel_intake
      - name: Produce at most one eligible clip
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          python production.py | tee "$RUNNER_TEMP/vsd-production-result.json"
      - name: Report catalogue readiness separately from render success
        if: steps.period.outputs.active == 'true'
        run: |
          python - <<'PYTHON'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'vsd-production-result.json').read_text())
          readiness=result.get('productionReadiness',{})
          lines=['## Production des vidéos',f"Nouveaux rendus : {result['produced']}."]
          if readiness:
              lines.append(f"Catalogue : {readiness['catalogueSize']} scénarios ; {readiness['renderedArtifacts']} déjà rendus ; {readiness['futureScenarios']} à venir ; {readiness['expiredScenarios']} expirés.")
              if readiness['status']=='no_new_renderable_scenario':
                  lines.append('**Catalogue épuisé : aucun nouveau scénario admissible. La création éditoriale reste à alimenter.**')
                  print('::warning title=Catalogue vidéo épuisé::Aucun nouveau scénario admissible ; ce succès technique ne prouve pas un renouvellement du stock.')
          lines.append('Les rendus ne prouvent ni une réservation Buffer, ni une publication, ni un stock publiable.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write('\n\n'.join(lines)+'\n')
          PYTHON
      - name: Preserve production readiness evidence
        if: steps.period.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-readiness
          path: ${{ runner.temp }}/vsd-production-result.json
          retention-days: 30
          if-no-files-found: error
      - name: Prepare at most one new article Pin draft
        if: steps.period.outputs.active == 'true'
        run: python pin_intake.py
      - name: Prepare one unpublished Reel storyboard from exact public excerpts
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          python reel_intake.py | tee "$RUNNER_TEMP/vsd-reel-intake.json"
      - name: Preserve Reel storyboard intake decision
        if: steps.period.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reel-storyboard-intake
          path: ${{ runner.temp }}/vsd-reel-intake.json
          retention-days: 30
          if-no-files-found: error
      - name: Admit one qualified Pin to its connected RSS feed
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          python pin_promotion.py | tee "$RUNNER_TEMP/vsd-pin-admission.json"
          if ! git diff --quiet -- ../../site-src/pinterest-additions.json; then
            echo 'VSD_PIN_FEED_CHANGED=true' >> "$GITHUB_ENV"
          fi
      - name: Preserve Pin admission decision
        if: steps.period.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pin-admission
          path: ${{ runner.temp }}/vsd-pin-admission.json
          retention-days: 30
          if-no-files-found: error
      - name: Persist finished media and receipts atomically
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          # Only this job's completed artifact directory is staged. Temporary
          # files/lock files are excluded by the dedicated output .gitignore.
          if [ -d reel-drafts ]; then git add -- reel-drafts; fi
          git add -- output pin-drafts pin-admissions.json ../../site-src/pinterest-additions.json ../../site-src/public-media.json ../../site-src/social-media/production
          if ! git diff --cached --quiet; then
            git -c user.name='Voyage Sans Détour' -c user.email='contact@voyagesansdetour.fr' commit -m 'Produce a reviewed media artifact with its receipt'
            git push origin HEAD:main
          fi
      - name: Deploy the admitted feed through the existing checked build
        if: env.VSD_PIN_FEED_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pages.yml --ref main --repo MathCSN/voyagesansdetour -f publish_pin_feed=true
