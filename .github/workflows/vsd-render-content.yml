# Daily: turn published guides into posts (auto_social.py: fast reels, carousels, photo posts),
# render them with the guarded engine, queue them in reviewed-social/, draw and admit Pins.
# No paid generator or social send. Only optional external call: free stock clips (Pexels) when its key is set.
name: Voyage Sans Detour reviewed media production

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions: {}
concurrency:
  group: vsd-reviewed-media-production
  cancel-in-progress: false

jobs:
  render:
    # Public standard GitHub runners only. A private repo is never a paid fallback.
    # The weekly schedule stays off until a qualified manual run is inspected.
    if: github.repository == 'MathCSN/voyagesansdetour' && github.ref == 'refs/heads/main' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.VSD_FREE_RENDER_SCHEDULE == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: .github/vsd-production
    steps:
      - name: Stop before fetching dependencies after the authorised period
        id: period
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import datetime as dt, os
          end = dt.datetime(2027, 9, 14, 21, 59, 59, tzinfo=dt.timezone.utc)
          active = dt.datetime.now(dt.timezone.utc) <= end
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          PY
      - name: Checkout the reviewed catalogue and existing render receipts
        if: steps.period.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Python 3.12
        if: steps.period.outputs.active == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare the free standard runner prerequisites
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate production guards
        if: steps.period.outputs.active == 'true'
        run: python -m unittest -q test_production test_auto_social test_stale_lots test_pin_draft test_pin_intake test_pin_promotion
      - name: Withdraw queued posts that quote a figure their guide no longer gives
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          # A guide corrected after a post was queued must not let the old figure go out: every batch still to come
          # is read again against the page published today (stale_lots.py). The slot of a withdrawn batch is given to
          # a new post by the next step. This guard never stops the day's production: when it cannot run, it says so.
          if ! python stale_lots.py --retire > "$RUNNER_TEMP/vsd-stale-lots.json"; then
            echo '::warning title=Posts en file non relus::stale_lots.py a échoué : les posts en file ne sont pas relus contre leurs guides aujourd’hui.'
            exit 0
          fi
          python - <<'PYTHON' || echo '::warning title=Résumé de la relecture des posts en file::Le résumé n’a pas pu être écrit ; les retraits éventuels sont dans reviewed-social/index.json.'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'vsd-stale-lots.json').read_text())
          rows={row['batchId']:row for row in result['batches']}
          lost=lambda batch:' ; '.join(entry['quote'][:120] for entry in rows[batch].get('missing',[]))
          lines=['## Posts en file relus contre leurs guides',f"Lots relus : {result['checked']}. Retirés : {len(result['retired'])}. À traiter à la main : {len(result['reported'])}. Non lus : {len(result['unread'])}."]
          lines+=[f"- retiré : {batch} ({rows[batch]['dueAt'][:16]}) : {lost(batch)}" for batch in result['retired']]
          for batch in result['reported']:
              lines.append(f"- **à traiter à la main** : {batch} ({rows[batch]['dueAt'][:16]}, {rows[batch].get('why','')}) : {lost(batch)}")
              print(f"::warning title=Post en file périmé non retiré::{batch} cite un chiffre que son guide ne donne plus ({rows[batch].get('why','')}) : à retirer du stock, ou à supprimer dans Buffer s'il y est déjà.")
          lines+=[f"- reformulé dans le guide, nombres toujours présents : {row['batchId']} ({len(row['reworded'])} citations)" for row in result['batches'] if row.get('reworded')]
          for row in result['batches']:
              for source in row.get('external',[]):
                  lines.append(f"- chiffres d'une autre source, non relus ici : {row['batchId']} ({str(row.get('dueAt'))[:16]}) : {source['quotes']} citation(s) de {source['url']}, relevée(s) le {(source.get('retrievedAt') or '')[:10] or 'date inconnue'}")
          if result['unread']:
              print('::warning title=Posts en file non relus::'+', '.join(result['unread'])+' : page du guide illisible ou scénario absent.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write('\n'.join(lines)+'\n\n')
          PYTHON
      - name: Plan posts from published guides so the queue covers three weeks
        if: steps.period.outputs.active == 'true'
        env:
          # Optional: free Pexels key for real video plans. Without it, reels are made of photos only.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python auto_social.py | tee "$RUNNER_TEMP/vsd-auto-social.json"
          python - <<'PYTHON'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'vsd-auto-social.json').read_text())
          lines=['## Posts automatiques',f"Nouveaux posts : {len(result.get('created',[]))}."]
          lines+=[f"- {c['channel']} {c.get('kind','')} {c.get('format') or ''} {c['publishAt'][:16]} : {c['guide']}" for c in result.get('created',[])]
          covered=', '.join(k+' '+(v or 'vide')[:10] for k,v in result.get('coveredUntil',{}).items())
          lines+=[f"File couverte jusqu'au : {covered}."]
          lines+=[f"- tenu : {h.get('slug')} ({h.get('channel','tous')} {h.get('kind','')}) : {h['reason']}" for h in result.get('held',[])]
          if result.get('status')=='queue_short':
              print('::warning title=File de posts courte::Moins de trois semaines de posts pour '+', '.join(result['shortChannels'])+' : aucun guide admissible (voir le résumé).')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write('\n'.join(lines)+'\n\n')
          PYTHON
      - name: Render every due post, at most six per run
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            python production.py | tee "$RUNNER_TEMP/vsd-production-result.json"
            if ! grep -q '"produced": 1' "$RUNNER_TEMP/vsd-production-result.json"; then break; fi
          done
      - name: Report catalogue readiness separately from render success
        if: steps.period.outputs.active == 'true'
        run: |
          python - <<'PYTHON'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'vsd-production-result.json').read_text())
          readiness=result.get('productionReadiness',{})
          lines=['## Production des vidéos',f"Nouveaux rendus : {result['produced']}."]
          if readiness:
              lines.append(f"Catalogue : {readiness['catalogueSize']} scénarios ; {readiness['renderedArtifacts']} déjà rendus ; {readiness['futureScenarios']} à venir ; {readiness['expiredScenarios']} expirés.")
              if readiness['status']=='no_new_renderable_scenario':
                  lines.append('**Catalogue épuisé : aucun nouveau scénario admissible. La création éditoriale reste à alimenter.**')
                  print('::warning title=Catalogue vidéo épuisé::Aucun nouveau scénario admissible ; ce succès technique ne prouve pas un renouvellement du stock.')
          lines.append('Les rendus ne prouvent ni une réservation Buffer, ni une publication, ni un stock publiable.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write('\n\n'.join(lines)+'\n')
          PYTHON
      - name: Preserve production readiness evidence
        if: steps.period.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-readiness
          path: ${{ runner.temp }}/vsd-production-result.json
          retention-days: 30
          if-no-files-found: error
      - name: Prepare the next Pin drafts, a few per run
        if: steps.period.outputs.active == 'true'
        run: python pin_intake.py
      - name: Publish rendered photo posts and queue their reviewed batches
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          python social_stock.py | tee "$RUNNER_TEMP/vsd-social-stock.json"
          if ! git diff --quiet -- ../../site-src/public-media.json; then
            echo 'VSD_SOCIAL_MEDIA_CHANGED=true' >> "$GITHUB_ENV"
          fi
      - name: Admit qualified Pins to their connected RSS feeds, two per run at most
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          python pin_promotion.py | tee "$RUNNER_TEMP/vsd-pin-admission.json"
          if ! git diff --quiet -- ../../site-src/pinterest-additions.json; then
            echo 'VSD_PIN_FEED_CHANGED=true' >> "$GITHUB_ENV"
          fi
      - name: Preserve Pin admission decision
        if: steps.period.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pin-admission
          path: ${{ runner.temp }}/vsd-pin-admission.json
          retention-days: 30
          if-no-files-found: error
      - name: Persist finished media and receipts atomically
        if: steps.period.outputs.active == 'true'
        run: |
          set -euo pipefail
          # Only this job's completed artifact directory is staged. Temporary
          # files/lock files are excluded by the dedicated output .gitignore.
          # Folders such as auto/ only exist once a post has been generated: stage what exists.
          paths=()
          for path in output reviewed-social pin-drafts pin-admissions.json scenarios catalogue.json auto assets/photos/auto assets/clips/auto ../../site-src/pinterest-additions.json ../../site-src/public-media.json ../../site-src/social-media/production; do
            if [ -e "$path" ]; then paths+=("$path"); fi
          done
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name='Voyage Sans Détour' -c user.email='contact@voyagesansdetour.fr' commit -m 'Produce reviewed posts from published guides, with their receipts'
            # Another workflow may have pushed meanwhile: replay this commit on top instead of losing the renders.
            git -c user.name='Voyage Sans Détour' -c user.email='contact@voyagesansdetour.fr' pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy the admitted feed through the existing checked build
        if: env.VSD_PIN_FEED_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pages.yml --ref main --repo MathCSN/voyagesansdetour -f publish_pin_feed=true
      - name: Put newly queued photo posts online before their import
        # A push made with GITHUB_TOKEN does not start the site build by itself.
        if: env.VSD_SOCIAL_MEDIA_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pages.yml --ref main --repo MathCSN/voyagesansdetour -f publish_reviewed_media=true
